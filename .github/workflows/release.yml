name: release

# Conventional-commit releases. release-please accumulates every feat/fix on
# main into a "release PR" that bumps the version and CHANGELOG; merging that
# PR tags vX.Y.Z and cuts the GitHub release. goreleaser then cross-builds and
# attaches the archives to that release.
#
# goreleaser runs in THIS workflow (gated on release_created) rather than a
# separate `on: push: tags` workflow on purpose: release-please pushes the tag
# with the built-in GITHUB_TOKEN, and tags pushed by that token do not trigger
# further workflow runs. Chaining here needs no personal access token.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        # config-file / manifest-file default to release-please-config.json and
        # .release-please-manifest.json at the repo root.

  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Without the tap token the cask pipe 401s and fails the whole release
      # *after* the archives are already published — a red run for a release
      # that actually shipped. Skip that one pipe instead; set the secret and
      # the cask starts publishing again with no change here. Hoisted to the job
      # because `secrets` is not a context a step-level `if` can read.
      CASK_SKIP: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN == '' && '--skip=homebrew' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The PHP-gated tests skip silently without a php binary — match ci.yml so
      # the release gate exercises the same suite.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: go test -race ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean ${{ env.CASK_SKIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the updated formula to pietervanleuven/homebrew-tap; the
          # built-in GITHUB_TOKEN cannot write to other repos.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Note a skipped Homebrew cask
        if: ${{ env.CASK_SKIP != '' }}
        run: |
          echo "::warning::HOMEBREW_TAP_GITHUB_TOKEN is unset — the release shipped without updating the Homebrew cask in pietervanleuven/homebrew-tap."
