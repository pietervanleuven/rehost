name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          # A bare run truncates duplicate findings (max-same-issues
          # defaults to 3) — CI must see the true list.
          args: --max-same-issues 0 --max-issues-per-linter 0

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The PHP-gated tests (credential echo-helpers, dump-php syntax and
      # shell round-trip) skip silently without a php binary — guarantee one
      # so they actually run on every OS.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: go vet ./...
      - run: go test -race ./...

  # The host-facing plumbing against a real sshd and a real database in a
  # container: the shell pipelines, credential staging and stream verifiers
  # that the mocked unit tests cannot reach. ubuntu-latest ships Docker;
  # macOS and Windows runners do not, so this stays a single-OS job.
  # See test/integration/README.md.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags integration -count=1 -timeout 30m -v ./test/integration/

  # Snapshot only — validates cross-compilation for all targets on every push
  # and PR; publishes nothing. The real release (tag + GitHub release +
  # archives) is release.yml, driven by release-please on merge to main.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --snapshot --clean
