name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          # A bare run truncates duplicate findings (max-same-issues
          # defaults to 3) — CI must see the true list.
          args: --max-same-issues 0 --max-issues-per-linter 0

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The PHP-gated tests (credential echo-helpers, dump-php syntax and
      # shell round-trip) skip silently without a php binary — guarantee one
      # so they actually run on every OS.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: go vet ./...
      - run: go test -race ./...

  # Snapshot only — validates cross-compilation for all targets. Nothing is
  # published: the public name (rehost vs decamp) is not final, see
  # docs/MARKETING.md §5. Do not add a release/tag workflow without checking
  # with the maintainer.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --snapshot --clean
