version: 2

project_name: rehost

builds:
  - main: ./cmd/rehost
    binary: rehost
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.*\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\(.*\))?!?:'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs"
      - "^chore"
      - "^ci"
      - "^test"

# Nothing is published until the public name (rehost vs decamp) is final and
# the maintainer signs off — see docs/MARKETING.md §5. CI runs snapshots only.
release:
  disable: true
