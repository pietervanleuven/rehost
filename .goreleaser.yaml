version: 2

project_name: rehost

builds:
  - main: ./cmd/rehost
    binary: rehost
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.*\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\(.*\))?!?:'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs"
      - "^chore"
      - "^ci"
      - "^test"

# release-please (.github/workflows/release.yml) creates the tag and the
# GitHub release with the CHANGELOG notes; goreleaser only uploads the built
# archives to that existing release, so keep-existing leaves the body alone.
# CI still runs snapshots (release --snapshot) and publishes nothing.
release:
  mode: keep-existing
