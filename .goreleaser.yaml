version: 2

project_name: rehost

builds:
  - main: ./cmd/rehost
    binary: rehost
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

# Publishes/updates Casks/rehost.rb in pietervanleuven/homebrew-tap on every
# release (a cask, not a formula — goreleaser deprecated `brews` for
# pre-built binaries; casks are macOS-only, Linux users take the archive).
# Needs the HOMEBREW_TAP_GITHUB_TOKEN secret (a token that can push to the
# tap repo) in the release workflow's goreleaser step. The post-install hook
# strips the quarantine attribute — the binaries are not notarized.
homebrew_casks:
  - repository:
      owner: pietervanleuven
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/pietervanleuven/rehost
    description: "Migrate a website between shared hosts over SSH, plan/apply style"
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/rehost"]
          end

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.*\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\(.*\))?!?:'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs"
      - "^chore"
      - "^ci"
      - "^test"

# release-please (.github/workflows/release.yml) creates the tag and the
# GitHub release with the CHANGELOG notes; goreleaser only uploads the built
# archives to that existing release, so keep-existing leaves the body alone.
# CI still runs snapshots (release --snapshot) and publishes nothing.
release:
  mode: keep-existing
